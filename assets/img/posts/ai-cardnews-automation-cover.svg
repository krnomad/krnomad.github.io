    <text x="28" y="45" font-size="24" font-weight="800" fill="#0f172a">Manus</text>
    <text x="28" y="82" font-size="20" fill="#475569">완성형 제품</text>

    <rect x="302" y="0" width="238" height="118" rx="18" fill="#f8fafc"/>
