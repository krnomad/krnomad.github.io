  <path d="M110 552H1090" stroke="url(#line)" stroke-width="10" stroke-linecap="round"/>
  <g fill="#f8fafc" font-family="Pretendard, Apple SD Gothic Neo, Segoe UI, sans-serif" font-size="20">
